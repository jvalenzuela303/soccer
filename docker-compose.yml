services:

  db:
    image: mariadb:10.6
    container_name: soccertrack_db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: rootpass
      MARIADB_DATABASE: soccertrack_wp
      MARIADB_USER: wpuser
      MARIADB_PASSWORD: wppass
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - soccertrack_net

  wordpress:
    image: wordpress:php8.2-apache
    container_name: soccertrack_wp
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8088:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: soccertrack_wp
      WORDPRESS_DB_USER: wpuser
      WORDPRESS_DB_PASSWORD: wppass
      WORDPRESS_DEBUG: "1"
      WORDPRESS_DEBUG_LOG: "1"
      WORDPRESS_DEBUG_DISPLAY: "0"
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_DEBUG_DISPLAY', false);
        define('WP_DEBUG_LOG', true);
        @ini_set('display_errors', 0);
    volumes:
      # Plugin montado directamente — hot-reload sin rebuild
      # :z requerido en Fedora/RHEL con SELinux activo
      - ./soccertrack:/var/www/html/wp-content/plugins/soccertrack:z
      - ./php/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:z
      # Uploads persistentes
      - wp_uploads:/var/www/html/wp-content/uploads
    networks:
      - soccertrack_net

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: soccertrack_pma
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8089:80"
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: rootpass
    networks:
      - soccertrack_net

volumes:
  db_data:
  wp_uploads:

networks:
  soccertrack_net:
    driver: bridge
